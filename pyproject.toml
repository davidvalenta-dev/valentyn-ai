[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valentyn-research"
version = "0.1.0"
description = "A local, Lean-verified automated reasoning research system"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
valentyn = "valentyn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["valentyn*"]

[tool.setuptools.package-data]
valentyn = ["data/*.json"]
